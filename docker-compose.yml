services:
  postgres:
    image: postgres:13
    container_name: inventory-control-postgres
    environment:
      POSTGRES_DB: inventorycontroldb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - inventory-control-network

volumes:
  postgres_data:

networks:
  inventory-control-network:
    driver: bridge